<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta
      name="description"
      content="CreatorOS — the AI operating system for content. Analytics, AI workspace, video lab, scheduling and monetization in one unified workspace."
    />

    <!-- Typography: Inter (primary UI + headings), mono for terminal surfaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Resolve theme before first paint so there is no flash of the wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('creatoros_theme');
          if (stored !== 'light' && stored !== 'dark') stored = 'dark';
          document.documentElement.setAttribute('data-theme', stored);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <title>CreatorOS — Your AI Operating System for Content</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
