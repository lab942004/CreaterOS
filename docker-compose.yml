version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: creatoros-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: creatoros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creatoros-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/creatoros?schema=public"
      JWT_SECRET: "creatoros-super-secret-jwt-key-2026"
      DEMO_MODE: "true"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creatoros-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: creatoros-admin
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:

